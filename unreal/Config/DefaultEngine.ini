; =====================================================================================================================
; Fourfold - engine settings.  Owner: stream `world_audio` (other streams request changes in their REQUESTS.md).
; Reviewed against the UE 5.8.2 public headers (RendererSettings.h, IOSRuntimeSettings.h, InputSettings.h, Engine.h) - see
; unreal/docs/world/README.md "Config review" for every decision.
;
; >>> OWNER: iOS signing.  UE 5.8 only has the modern Xcode workflow, and the generated Xcode project takes PRODUCT_BUNDLE_IDENTIFIER
; >>> and DEVELOPMENT_TEAM from [/Script/MacTargetPlatform.XcodeProjectSettings] (BundleIdentifier, CodeSigningTeam) - those two are
; >>> the EDIT-ME keys (editor: Project Settings > Platforms > Xcode Projects > "Bundle ID" and "Apple Dev Account Team ID").
; >>> Put the SAME two values into [/Script/IOSRuntimeSettings.IOSRuntimeSettings] BundleIdentifier / IOSTeamID (read only by the
; >>> Turnkey / legacy packaging path) so every path agrees.  Search this file for EDIT-ME: four lines, two values.
;
; Rendering: iOS uses the mobile FORWARD renderer with 4x MSAA (crisp thin effects, cheap on Apple TBDR GPUs).  The Mac editor /
; Mac game use the desktop renderer (Lumen GI) - preview the phone look with Platform Preview > iOS.
; Exposure: the level's post-process volume fixes EV100 at -0.263 (exposure scale exactly 1.0), so emissive 1.0 shows as 1.0 and a
; diffuse white under a 3.14 lux light shows as 1.0 (the world builder places sun 3.2 lux, sky light 1.0).
; =====================================================================================================================

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Fourfold/Maps/L_Lab.L_Lab
GameDefaultMap=/Game/Fourfold/Maps/L_Lab.L_Lab
GlobalDefaultGameMode=/Script/Fourfold.FourfoldGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
; --- mobile (iOS): forward shading, MSAA 4x, static lighting + stationary sun with CSM for the movable fighters
r.Mobile.ShadingPath=0
r.Mobile.AntiAliasing=3
r.MSAACount=4
r.MobileHDR=True
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.EnableMovableLightCSMShaderCulling=True
r.Mobile.AllowDistanceFieldShadows=False
r.Mobile.AmbientOcclusion=False
; local lights on mobile forward (lanterns / VFX lights; 5.8 replaced the old "N dynamic point lights" cvars by clustered local lights)
r.Mobile.Forward.EnableLocalLights=1
r.Mobile.Forward.EnableClusteredReflections=False
; per-pixel fog: the courtyard meshes are coarse (a few big quads), per-vertex fog would show as flat gradients
r.VertexFoggingForOpaque=False
; mobile uses the low-quality (simple directional) lightmap permutations
r.SupportLowQualityLightmaps=True
; --- shared
r.AllowStaticLighting=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=1
r.DefaultFeature.AutoExposure.Bias=0.0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=True
r.CustomDepth=1
r.ReflectionCaptureResolution=256
; physical sky (SkyAtmosphere + VolumetricCloud); iOS trims clouds / volumetric fog in IOS/IOSEngine.ini
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.SupportStationarySkylight=True
r.SkinCache.CompileShaders=True
; --- desktop (Mac editor / Mac game): Lumen GI + reflections, virtual shadow maps; Lumen software tracing needs mesh distance fields
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
; render at 75 % and let TSR reconstruct: Lumen / clouds / fog scale with the pixel count (Mac game measured 22 -> ~14 ms GPU)
r.ScreenPercentage.Default.Desktop.Mode=1
r.ScreenPercentage.Default=75
r.Lumen.TraceMeshSDFs=1
r.VolumetricFog=1
; MetaHuman fighters (their asset guidelines): GPU skin cache shaders, 16-bit bone indices, unlimited influences
r.GPUSkin.Support16BitBoneIndex=True
r.GPUSkin.UnlimitedBoneInfluences=True
SkeletalMesh.UseExperimentalChunking=1

[SystemSettings]
; console variables that are not project settings (applied at start-up on every platform; IOS/IOSEngine.ini adds iOS-only ones)
r.Shadow.CSM.MaxMobileCascades=2

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; ----- EDIT-ME (mirror): keep these two equal to XcodeProjectSettings BundleIdentifier / CodeSigningTeam further down.
; ----- In 5.8 they are only read by Turnkey / the legacy packaging path; the Xcode project uses the XcodeProjectSettings keys.
BundleIdentifier=com.example.fourfold
IOSTeamID=
bAutomaticSigning=True
BundleDisplayName=Fourfold
BundleName=Fourfold
VersionInfo=0.1.0
MinimumiOSVersion=IOS_17
bSupportsIPad=True
bSupportsIPhone=True
bSupportsMetal=True
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
PreferredLandscapeOrientation=LandscapeLeft
; frame pacing: no engine lock (the game caps with t.MaxFPS = 30 / 60 / 120 from its Settings page); ProMotion iPhones may run 120 Hz
; (this switch adds CADisableMinimumFrameDurationOnPhone to the Info.plist) and the pacer follows the device's max refresh rate
FrameRateLock=PUFRL_None
bSupportHighRefreshRates=True
bEnableDynamicMaxFPS=True
; input / power: gamepads allowed, motion sensors off (battery), no integrated keyboard
bAllowControllers=True
bDisableMotionData=True
bUseIntegratedKeyboard=False
; audio (FourfoldAudio): 48 kHz like the sound set; 512-frame callbacks = ~10.7 ms per buffer (lower latency for hit sounds);
; raise AudioCallbackBufferFrameSize to 1024 if a device crackles.  Voice limit is min(this, Audio quality level MaxChannels = 32).
AudioSampleRate=48000
AudioCallbackBufferFrameSize=512
AudioNumBuffersToEnqueue=2
AudioMaxChannels=32
bSupportsBackgroundAudio=False
bEnableGameCenterSupport=False
bEnableCloudKitSupport=False
bEnableRemoteNotificationsSupport=False

[/Script/MacTargetPlatform.XcodeProjectSettings]
; UE 5.8: modern Xcode is the only workflow (bUseModernXcode is deprecated and ignored, so it is not set here).  The generated
; Xcode project (GenerateProjectFiles / "Generate Xcode Project") reads PRODUCT_BUNDLE_IDENTIFIER from BundleIdentifier and
; DEVELOPMENT_TEAM from CodeSigningTeam below - these are what make automatic signing for a device build work.
bUseAutomaticCodeSigning=True
; ----- EDIT-ME (1/2): your 10-character Apple Team ID (developer.apple.com > Account > Membership details)
; -----               editor: Project Settings > Platforms > Xcode Projects > Apple Dev Account Team ID
CodeSigningTeam=
; ----- EDIT-ME (2/2): a unique reverse-DNS id you own, e.g. com.<yourname>.fourfold (com.example.* cannot be registered)
; -----               editor: Project Settings > Platforms > Xcode Projects > Bundle ID
BundleIdentifier=com.example.fourfold
; prefix used for any bundle that has no explicit id (keep it the first part of BundleIdentifier)
CodeSigningPrefix=com.example

[/Script/MacTargetPlatform.MacTargetSettings]
; Apple silicon, macOS 15+: Metal SM6 (Lumen / Nanite in the editor and the Mac game)
+TargetedRHIs=SF_METAL_SM6

[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=50F8F75BEB469065A2627886E08843F9
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
