; Fourfold - scalability groups.  Owner: stream `world_audio`.
; The game maps its Settings > Graphics level to Scalability::SetQualityLevels(SetFromSingleQualityLevel(L)):
;   iOS / iPadOS: L = 0 Low, 1 Medium, 2 High          Mac / PC: L = 1 Medium, 2 High, 3 Epic  (auto-lowers on frame spikes)
; Only the groups / cvars that matter for this game are overridden (the engine defaults of BaseScalability.ini apply to the rest).
; Level @0 is the weakest iPhone target (iPhone 12 class), @1 mid devices, @2 recent iPhones / iPads, @3 Mac (Epic).
; The arena's shadows are baked (stationary sun); these groups only scale the CSM for the movable fighters, bloom and effect detail.

[ShadowQuality@0]
r.LightFunctionQuality=0
r.ShadowQuality=1
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=512
r.Shadow.MaxCSMResolution=512
r.Shadow.RadiusThreshold=0.06
r.Shadow.DistanceScale=0.6
r.Shadow.CSM.TransitionScale=0
r.Shadow.PreShadowResolutionFactor=0.5
r.DistanceFieldShadowing=0
r.VolumetricFog=0
r.LightMaxDrawDistanceScale=0.5
r.CapsuleShadows=0

[ShadowQuality@1]
r.LightFunctionQuality=1
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.RadiusThreshold=0.05
r.Shadow.DistanceScale=0.8
r.Shadow.CSM.TransitionScale=0.5
r.Shadow.PreShadowResolutionFactor=0.5
r.DistanceFieldShadowing=0
r.VolumetricFog=0
r.LightMaxDrawDistanceScale=0.75
r.CapsuleShadows=0

[ShadowQuality@2]
r.LightFunctionQuality=1
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=2048
r.Shadow.MaxCSMResolution=2048
r.Shadow.RadiusThreshold=0.04
r.Shadow.DistanceScale=1.0
r.Shadow.CSM.TransitionScale=1.0
r.Shadow.PreShadowResolutionFactor=0.5
r.DistanceFieldShadowing=1
r.VolumetricFog=0
r.LightMaxDrawDistanceScale=1.0
r.CapsuleShadows=1

[ShadowQuality@3]
r.LightFunctionQuality=2
r.ShadowQuality=5
r.Shadow.CSM.MaxCascades=4
r.Shadow.MaxResolution=4096
r.Shadow.MaxCSMResolution=4096
r.Shadow.RadiusThreshold=0.03
r.Shadow.DistanceScale=1.0
r.Shadow.CSM.TransitionScale=1.0
r.Shadow.PreShadowResolutionFactor=1.0
r.DistanceFieldShadowing=1
r.VolumetricFog=1
r.LightMaxDrawDistanceScale=1.5
r.CapsuleShadows=1
; volumetric fog: the 8 px grid cost ~1.9 ms; 12 px looks the same through the courtyard haze
r.VolumetricFog.GridPixelSize=12

