; Fourfold - input settings.  Owner: stream `world_audio` (stream `game` requests changes).
; The game reads keyboard / gamepad keys itself (APlayerController key state) and draws its own Slate touch overlay, so the engine's
; default virtual joysticks are disabled.  Names verified against InputSettings.h (UE 5.8.2).

