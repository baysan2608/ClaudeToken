; Fourfold - iOS-only engine overrides (layered over DefaultEngine.ini).  Owner: stream `world_audio`.

[SystemSettings]
; 0 = native resolution (very expensive on 3x phones / iPads).  2.0 = retina-class, the recommended start; tune on device
; (docs/world/README.md: if a 10-minute Free Spar drops below 50 fps, try 1.5).
r.MobileContentScaleFactor=2.0
; keep the iOS shadow budget: one cascade pair, modest resolution (fighters only; the arena's shadows are baked)
r.Shadow.CSM.MaxMobileCascades=2
r.Shadow.MaxCSMResolution=1024
